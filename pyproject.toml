[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bqtofabric"
version = "0.1.0"
description = "Assess and plan migrations from Google BigQuery to Microsoft Fabric"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlglot>=27.0,<29",
]

[project.optional-dependencies]
gcp = [
    "google-auth>=2.30",
    "requests>=2.31",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyright>=1.1.390",
    "ruff>=0.9",
]

[project.scripts]
bqtofabric = "bqtofabric.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
# Keeps `scripts` importable whether pytest runs as a console script or via `python -m`.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
